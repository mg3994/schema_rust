[workspace]
resolver = "2"
members = [
    "crates/schemaorg-core",
    "crates/schemaorg-vocabulary",
    "crates/schemaorg-codegen",
    "crates/schemaorg-html",
    "crates/schemaorg-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SchemaOrg Engine Authors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
html5ever = "0.29"
kuchikiki = "0.8"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
criterion = "0.5"
